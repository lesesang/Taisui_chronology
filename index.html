<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101523"><title>세성기년법 · 태세 달력 환산기</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#0c101c;color:#edf0f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 10%,#39446a 0,#151b30 28%,transparent 55%),#0c101c}main{width:min(1020px,calc(100% - 32px));margin:auto;padding:34px 0 70px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:38px}.brand{font-weight:800;letter-spacing:.12em;color:#c9d5ff}.eyebrow{color:#9cb4ea;font-size:.85rem;letter-spacing:.15em}h1{font-size:clamp(2rem,5vw,3.7rem);letter-spacing:-.055em;margin:8px 0 12px}.intro{color:#abb6cf;line-height:1.7;margin:0 0 32px}.shell{border:1px solid #3c4b6b;border-radius:22px;background:#151d30e8;box-shadow:0 26px 70px #0005;overflow:hidden}.tabs{display:flex;gap:5px;padding:15px 18px;border-bottom:1px solid #34425f;flex-wrap:wrap}.tabs button{font:inherit;color:#aebbd6;background:none;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}.tabs button[aria-selected=true]{background:#384e82;color:#fff}.content{padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:24px}.input-panel,.result-panel{min-width:0}.label{color:#9faed0;font-size:.9rem;margin:0 0 13px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.fields.single{grid-template-columns:1fr}.field label{display:block;font-size:.9rem;margin:0 0 9px;color:#d8e0f2}.field input{width:100%;padding:15px 14px;border:1px solid #52617e;border-radius:11px;background:#0e1628;color:white;font:inherit;font-size:1.2rem;font-variant-numeric:tabular-nums;outline:none}.field input:focus{border-color:#a7beff;box-shadow:0 0 0 3px #8ca8ff30}.hint{color:#a4b0c9;font-size:.875rem;line-height:1.6;margin:16px 0}.error{color:#ffb8b8;min-height:1.4em;font-size:.875rem}.result-panel{border-radius:16px;background:#202c48;padding:21px}.result-panel h2{font-size:1rem;margin:0 0 16px}.result{padding:13px 0;border-top:1px solid #3b4b6b}.result:first-of-type{border-top:0}.result small{display:block;color:#a9b9d9;font-size:.85rem;margin-bottom:4px}.result strong{font-size:clamp(1.15rem,3vw,1.65rem);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.foot{margin-top:22px;border-top:1px solid #34425f;padding:19px 28px;color:#aebbd5;line-height:1.7;font-size:.9rem}.foot b{color:#e3e9f7}button:focus-visible{outline:2px solid #c4d3ff;outline-offset:2px}@media(max-width:720px){main{padding-top:22px}.content{grid-template-columns:1fr;padding:20px}.foot{padding:18px 20px}.tabs{padding:10px}.tabs button{padding:10px}header{margin-bottom:26px}}
</style></head><body><main><header><div class="brand">世星紀年法 <span aria-hidden="true">✦</span></div><span class="eyebrow">태세 달력</span></header><h1>세성기년법 환산기</h1><p class="intro">태세의 하루와 한 해를 기준으로 날짜의 길이를 환산합니다.</p><section class="shell" aria-label="시간 환산기"><div class="tabs" role="tablist" aria-label="입력 단위"><button type="button" role="tab" id="tab-day" aria-selected="true" aria-controls="input-area" data-mode="day">태세일</button><button type="button" role="tab" id="tab-year" aria-selected="false" aria-controls="input-area" data-mode="year">태세년</button><button type="button" role="tab" id="tab-combined" aria-selected="false" aria-controls="input-area" data-mode="combined">태세년 + 일</button><button type="button" role="tab" id="tab-earth" aria-selected="false" aria-controls="input-area" data-mode="earth">지구일</button><button type="button" role="tab" id="tab-earth-year" aria-selected="false" aria-controls="input-area" data-mode="earth-year">지구년</button><button type="button" role="tab" id="tab-earth-combined" aria-selected="false" aria-controls="input-area" data-mode="earth-combined">지구년 + 일</button></div><div class="content"><div class="input-panel"><p class="label">환산할 기간</p><div id="input-area" role="tabpanel" aria-labelledby="tab-day"></div><p class="hint" id="input-hint"></p><div class="error" id="error" role="status" aria-live="polite"></div></div><div class="result-panel" aria-live="polite"><h2>환산 결과</h2><div class="result"><small>태세일</small><strong id="days-result">—</strong></div><div class="result"><small>태세년</small><strong id="years-result">—</strong></div><div class="result"><small>태세년 + 일</small><strong id="combined-result">—</strong></div><div class="result"><small>지구일</small><strong id="earth-days-result">—</strong></div><div class="result"><small>지구년</small><strong id="earth-years-result">—</strong></div><div class="result"><small>지구년 + 일</small><strong id="earth-combined-result">—</strong></div></div></div><div class="foot"><b>환산 기준</b>　태세 1일 = 지구 10시간 · 태세 1년 = 4,350태세일 = 지구 1,812.5일. 지구 1년은 365일로 계산합니다. 연도는 경과한 기간을 뜻합니다.</div></section></main><script>
const YEAR=4350, HOURS=10, EARTH_YEAR=365;const area=document.querySelector('#input-area'),hint=document.querySelector('#input-hint'),error=document.querySelector('#error');const nf=new Intl.NumberFormat('ko-KR',{maximumFractionDigits:8});let mode='day';const defaults={day:[''],year:[''],combined:['',''],earth:[''],'earth-year':[''],'earth-combined':['','']};const specs={day:{labels:['태세일'],hint:'소수점 입력이 가능합니다.'},year:{labels:['태세년'],hint:'1태세년은 4,350태세일입니다.'},combined:{labels:['태세년','나머지 태세일'],hint:'나머지 태세일은 0 이상 4,350 미만으로 입력하세요.'},earth:{labels:['지구일'],hint:'지구의 하루는 24시간으로 계산합니다.'},'earth-year':{labels:['지구년'],hint:'지구 1년은 365일로 계산합니다.'},'earth-combined':{labels:['지구년','나머지 지구일'],hint:'나머지 지구일은 0 이상 365 미만으로 입력하세요.'}};function fmt(n){return nf.format(n)}function render(){const s=specs[mode];area.className='fields'+(s.labels.length===1?' single':'');area.setAttribute('aria-labelledby','tab-'+mode);area.innerHTML=s.labels.map((label,i)=>`<div class="field"><label for="value-${i}">${label}</label><input id="value-${i}" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="${defaults[mode][i]}"></div>`).join('');hint.textContent=s.hint;area.querySelectorAll('input').forEach(el=>el.addEventListener('input',calculate));calculate()}function output(id,value){document.getElementById(id).textContent=value}function clear(){['days','years','combined','earth-days','earth-years','earth-combined'].forEach(id=>output(id+'-result','—'))}function calculate(){const fields=[...area.querySelectorAll('input')];const vals=fields.map(e=>e.value.trim()===''?NaN:Number(e.value));if(vals.some(n=>!Number.isFinite(n)||n<0)||(mode==='combined'&&vals[1]>=YEAR)||(mode==='earth-combined'&&vals[1]>=EARTH_YEAR)){error.textContent=mode==='combined'?'나머지 태세일은 0 이상 4,350 미만으로 입력하세요.':mode==='earth-combined'?'나머지 지구일은 0 이상 365 미만으로 입력하세요.':'0 이상의 숫자를 입력하세요.';clear();return}let days=mode==='day'?vals[0]:mode==='year'?vals[0]*YEAR:mode==='combined'?vals[0]*YEAR+vals[1]:mode==='earth'?vals[0]*24/HOURS:mode==='earth-year'?vals[0]*EARTH_YEAR*24/HOURS:(vals[0]*EARTH_YEAR+vals[1])*24/HOURS;if(!Number.isFinite(days)||days>Number.MAX_SAFE_INTEGER){error.textContent='입력값이 너무 큽니다.';clear();return}error.textContent='';const years=Math.floor(days/YEAR);let remainder=days-years*YEAR;if(remainder>=YEAR-1e-9){remainder=0}output('days-result',fmt(days)+'일');output('years-result',fmt(days/YEAR)+'년');output('combined-result',fmt(years)+'년 '+fmt(remainder)+'일');const earthDays=days*HOURS/24;const earthYears=Math.floor(earthDays/EARTH_YEAR);const earthRemainder=earthDays-earthYears*EARTH_YEAR;output('earth-days-result',fmt(earthDays)+'일');output('earth-years-result',fmt(earthDays/EARTH_YEAR)+'년');output('earth-combined-result',fmt(earthYears)+'년 '+fmt(earthRemainder)+'일')}document.querySelectorAll('[role=tab]').forEach(btn=>btn.addEventListener('click',()=>{mode=btn.dataset.mode;document.querySelectorAll('[role=tab]').forEach(b=>b.setAttribute('aria-selected',String(b===btn)));render();area.querySelector('input').focus()}));render();
</script></body></html>
